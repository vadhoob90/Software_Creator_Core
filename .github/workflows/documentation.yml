name: Core quality and build

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: core-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Validate repository policy files
        run: |
          test -s README.md
          test -s LICENSE.md
          test -s LICENSING.md
          test -s NOTICE
          git diff --check
      - name: Validate local Markdown links
        run: python .github/scripts/check_markdown_links.py

  required:
    name: Required checks
    if: always()
    needs: [documentation, software, mutation, security, package]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks
        env:
          DOCUMENTATION: ${{ needs.documentation.result }}
          SOFTWARE: ${{ needs.software.result }}
          MUTATION: ${{ needs.mutation.result }}
          SECURITY: ${{ needs.security.result }}
          PACKAGE: ${{ needs.package.result }}
        run: |
          test "${DOCUMENTATION}" = success
          test "${SOFTWARE}" = success
          test "${MUTATION}" = success
          test "${SECURITY}" = success
          test "${PACKAGE}" = success

  software:
    name: Software tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.11.29
      - run: uv sync --frozen --python '${{ matrix.python }}'
      - name: Static analysis and complexity
        run: |
          mkdir -p reports
          uv run --no-sync ruff check src tests scripts
          uv run --no-sync ruff format --check src tests scripts
          uv run --no-sync mypy
          uv run --no-sync python scripts/check_quality.py > reports/quality.json
      - name: Offline tests and coverage
        run: |
          uv run --no-sync pytest --cov=software_creator_core --cov-branch --cov-report=json --cov-report=xml --junitxml=reports/tests.xml
          uv run --no-sync python scripts/check_test_report.py reports/tests.xml
          uv run --no-sync python scripts/check_coverage.py > reports/coverage-all.json
      - name: Changed-code coverage against PR base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: uv run --no-sync python scripts/check_coverage.py --base "$BASE_SHA" > reports/coverage-changed.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: evidence-python-${{ matrix.python }}
          path: |
            reports/
            coverage.json
            coverage.xml
          if-no-files-found: error

  mutation:
    name: Critical decision mutation tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install uv==0.11.29
      - run: uv sync --frozen
      - run: uv run --no-sync mutmut run --max-children 2
      - run: uv run --no-sync python scripts/check_mutations.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mutation-evidence
          path: mutants/src/software_creator_core/*.meta
          if-no-files-found: error

  security:
    name: Source, secret and dependency scans
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install uv==0.11.29
      - run: uv sync --frozen
      - run: uv run --no-sync bandit -q -r src/software_creator_core
      - run: uv run --no-sync python scripts/check_secrets.py
      - name: Audit locked runtime dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt > /tmp/core-requirements.txt
          uv run --no-sync pip-audit -r /tmp/core-requirements.txt --disable-pip --no-deps

  package:
    name: Build and inspect distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install uv==0.11.29
      - run: uv sync --frozen
      - run: uv build
      - name: Install built wheel in a clean environment
        run: |
          uv venv /tmp/core-wheel
          uv export --frozen --no-dev --no-emit-project --format requirements-txt > /tmp/core-requirements.txt
          uv pip install --python /tmp/core-wheel/bin/python -r /tmp/core-requirements.txt dist/*.whl
          /tmp/core-wheel/bin/software-creator --version
          /tmp/core-wheel/bin/software-creator schema job
          /tmp/core-wheel/bin/software-creator role software-engineer
          /tmp/core-wheel/bin/python -I scripts/demo.py
          sha256sum dist/* > dist/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core-distribution-${{ github.sha }}
          path: dist/
          if-no-files-found: error
