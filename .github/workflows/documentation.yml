name: Documentation checks

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  documentation:
    name: documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Validate repository policy files
        run: |
          test -s README.md
          test -s LICENSE.md
          test -s LICENSING.md
          test -s NOTICE
          git diff --check
      - name: Validate local Markdown links
        run: python .github/scripts/check_markdown_links.py

  required:
    name: Required checks
    if: always()
    needs: [documentation]
    runs-on: ubuntu-latest
    steps:
      - name: Require documentation validation
        env:
          DOCUMENTATION: ${{ needs.documentation.result }}
        run: test "${DOCUMENTATION}" = success
